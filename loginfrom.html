<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
    form { border: 1px solid #ccc; padding: 30px; border-radius: 8px; }
    input { display: block; width: 100%; margin-bottom: 15px; padding: 10px; }
  </style>
</head>
<body>
  <form>
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button type="submit">Login</button>
  </form>
</body>
</html>
