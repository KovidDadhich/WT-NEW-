<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    h1 { color: #2E8B57; }
    .section { margin-bottom: 20px; }
    .heading { font-weight: bold; font-size: 18px; border-bottom: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>John Doe</h1>
  <p>Email: john@example.com | Phone: 123-456-7890</p>

  <div class="section">
    <div class="heading">Objective</div>
    <p>To work in a dynamic environment and grow with the organization.</p>
  </div>

  <div class="section">
    <div class="heading">Education</div>
    <ul>
      <li>B.Tech in CSE, XYZ University</li>
      <li>HSC - ABC School</li>
    </ul>
  </div>

  <div class="section">
    <div class="heading">Skills</div>
    <p>HTML, CSS, JavaScript, C, Python</p>
  </div>
</body>
</html>
