<!DOCTYPE html>
<html>
<head>
  <title>JS Display</title>
</head>
<body>
  <h2 id="display">Hello!</h2>
  <button onclick="showMessage()">Click Me</button>

  <script>
    function showMessage() {
      document.getElementById("display").innerText = "JavaScript Changed This Text!";
    }
  </script>
</body>
</html>
